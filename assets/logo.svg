<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Emerald Glow Gradient for Wi-Fi and W -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Blue Gradient for WARP Shield -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Neon Green Glow Filter -->
    <filter id="neon-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Blue Glow Filter -->
    <filter id="neon-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glassmorphism Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Cyber Circle/Hexagon Grid Lines -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="16 8" opacity="0.4" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#334155" stroke-width="1" opacity="0.2" />

  <!-- Outer Tech Accents (Corner brackets / Tick marks) -->
  <path d="M 256 16 L 256 28 M 256 484 L 256 496 M 16 256 L 28 256 M 484 256 L 496 256" stroke="#475569" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  
  <g filter="url(#shadow)">
    <!-- 1. WARP Shield (Khiên bảo vệ xanh dương cách điệu) -->
    <path d="M 256 120 
             C 310 120, 360 100, 390 85 
             C 390 180, 390 280, 345 355
             C 310 415, 275 435, 256 445 
             C 237 435, 202 415, 167 355
             C 122 280, 122 180, 122 85
             C 152 100, 202 120, 256 120 Z" 
          fill="none" 
          stroke="url(#blue-grad)" 
          stroke-width="12" 
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neon-glow-blue)" />
          
    <path d="M 256 138 
             C 300 138, 340 122, 368 110 
             C 368 185, 368 265, 330 330
             C 300 380, 272 398, 256 408 
             C 240 398, 212 380, 182 330
             C 144 265, 144 185, 144 110
             C 172 122, 212 138, 256 138 Z" 
          fill="#0f172a" 
          fill-opacity="0.6" 
          stroke="#1e293b" 
          stroke-width="3" />

    <!-- 2. Wi-Fi Radiating Waves (Sóng Wi-Fi ở phần đỉnh khiên) -->
    <!-- Wave 3 (Outer) -->
    <path d="M 180 180 A 110 110 0 0 1 332 180" 
          fill="none" 
          stroke="url(#emerald-grad)" 
          stroke-width="8" 
          stroke-linecap="round"
          opacity="0.3" />
    
    <!-- Wave 2 (Middle) -->
    <path d="M 205 205 A 72 72 0 0 1 307 205" 
          fill="none" 
          stroke="url(#emerald-grad)" 
          stroke-width="8" 
          stroke-linecap="round"
          opacity="0.6" />

    <!-- Wave 1 (Inner) -->
    <path d="M 230 230 A 36 36 0 0 1 282 230" 
          fill="none" 
          stroke="url(#emerald-grad)" 
          stroke-width="8" 
          stroke-linecap="round"
          filter="url(#neon-glow-green)" />

    <!-- 3. Central Stylized "W" (Chữ W cách điệu mạng lưới công nghệ) -->
    <g filter="url(#neon-glow-green)">
      <!-- Left diagonal line -->
      <path d="M 180 230 L 225 340 L 256 280 L 287 340 L 332 230" 
            fill="none" 
            stroke="url(#emerald-grad)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
            
      <!-- Tech connection lines inside W -->
      <path d="M 225 340 L 256 385" 
            fill="none" 
            stroke="url(#emerald-grad)" 
            stroke-width="8" 
            stroke-linecap="round" />
            
      <path d="M 287 340 L 256 385" 
            fill="none" 
            stroke="url(#emerald-grad)" 
            stroke-width="8" 
            stroke-linecap="round" />

      <!-- Network Nodes (Circles at intersections/ends) -->
      <circle cx="180" cy="230" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" />
      <circle cx="332" cy="230" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" />
      <circle cx="256" cy="280" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" />
      <circle cx="225" cy="340" r="8" fill="#10b981" />
      <circle cx="287" cy="340" r="8" fill="#10b981" />
      <circle cx="256" cy="385" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" />
    </g>
  </g>
</svg>
