<!-- Available Wi-Fi Networks Modal Component -->
<div id="wifi-list-modal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 select-none">
  <div class="bg-slate-900/90 border border-slate-800/80 max-w-lg w-full mx-4 rounded-[28px] p-6 shadow-2xl transform scale-95 -translate-y-4 transition-all duration-300 relative overflow-hidden backdrop-blur-xl">
    
    <div class="flex items-center justify-between pb-4 border-b border-slate-800/80 relative z-10">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20 text-emerald-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10.5 10.5 0 0114.14 0M1.414 8.414a15 15 0 0121.172 0"/>
          </svg>
        </div>
        <div>
          <h3 class="text-md font-bold text-slate-200">Available Wi-Fi Networks</h3>
          <p class="text-xs text-slate-400 mt-0.5">Select a network and provide credentials to connect.</p>
        </div>
      </div>
      <button id="wifi-list-close" class="p-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-400 hover:text-white rounded-xl border border-slate-700 transition duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Radar scanning graphics (Only displays when isScanning is true) -->
    <div id="wifi-radar-container" class="hidden py-8 flex flex-col items-center justify-center space-y-4 border-b border-slate-800/60 bg-slate-950/20 relative z-10">
      <div class="relative w-20 h-20 border border-emerald-500/20 rounded-full flex items-center justify-center">
        <!-- Concentric dynamic waves -->
        <div class="absolute inset-0 rounded-full border border-emerald-500/30 animate-ping opacity-60"></div>
        <div class="absolute inset-4 rounded-full border border-emerald-500/40 animate-pulse"></div>
        <div class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center shadow-[0_0_12px_rgba(16,185,129,0.8)] z-10">
          <svg class="w-3.5 h-3.5 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"/>
          </svg>
        </div>
      </div>
      <p class="text-xs text-emerald-400 font-semibold uppercase tracking-wider animate-pulse">Scanning frequencies...</p>
    </div>

    <!-- Scrollable Wi-Fi network list cards -->
    <div id="wifi-container" class="space-y-2 overflow-y-auto max-h-[360px] my-4 pr-1.5 custom-scrollbar relative z-10">
      <!-- Initial scanning loader -->
      <div class="py-12 flex flex-col items-center justify-center space-y-3">
        <div class="w-8 h-8 border-2 border-emerald-500/20 border-t-emerald-400 rounded-full animate-spin"></div>
        <p class="text-sm text-slate-400">Discovering nearby wireless systems...</p>
      </div>
    </div>

    <!-- Bottom modal control footer -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800/80 text-xs text-slate-500 relative z-10">
      <span>Found: <strong id="wifi-count" class="text-emerald-400">0</strong> networks in range</span>
      <button id="btn-scan" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700/60 active:scale-95 text-xs text-slate-300 py-2 px-4 rounded-xl transition duration-200 select-none shadow-md">
        <svg id="icon-scan" class="w-3.5 h-3.5 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"/>
        </svg>
        <span>Scan range</span>
      </button>
    </div>
  </div>
</div>
