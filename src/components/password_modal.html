<!-- Password Input dialog modal -->
<div id="password-modal" class="fixed inset-0 bg-slate-950/75 backdrop-blur-md z-[60] flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 select-none">
  <div class="bg-slate-900/90 border border-slate-800 max-w-sm w-full mx-4 rounded-3xl p-6 shadow-2xl transform scale-90 transition-transform duration-300 relative overflow-hidden backdrop-blur-xl">
    <div class="flex items-center space-x-3.5 mb-4 relative z-10">
      <div class="bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20 text-emerald-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <div>
        <h3 class="text-md font-bold text-slate-200">Connect to Network</h3>
        <p id="modal-ssid" class="text-xs text-slate-400">Wi-Fi Connection Target</p>
      </div>
    </div>

    <form id="wifi-form" class="space-y-4 relative z-10">
      <div>
        <label for="wifi-password" class="block text-[9px] font-bold text-slate-500 mb-1.5 uppercase tracking-widest">WPA Security Key</label>
        <input type="password" id="wifi-password" placeholder="Enter WPA network password..." class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-sm text-slate-200 placeholder-slate-700 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/20 transition duration-300 font-mono" autocomplete="current-password" />
      </div>

      <div class="flex gap-2.5 pt-2">
        <button type="button" id="btn-cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition duration-200 border border-slate-700 shadow-md">Cancel</button>
        <button type="submit" id="btn-connect" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg shadow-emerald-500/15 transition duration-200 flex items-center justify-center space-x-1.5 select-none">
          <span>Connect</span>
        </button>
      </div>
    </form>
  </div>
</div>
