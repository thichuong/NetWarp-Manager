<!-- Application Header Component -->
<header class="relative z-10 border-b border-slate-900 bg-slate-950/60 backdrop-blur-xl px-8 py-3.5 select-none">
  <div class="w-full mx-auto flex items-center justify-between">
    <div class="flex items-center space-x-3.5">
      <!-- Premium Custom Designed Brand Logo -->
      <svg class="w-11 h-11 drop-shadow-md select-none" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="header-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
          </linearGradient>
          <linearGradient id="header-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
          </linearGradient>
          <linearGradient id="header-orange-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ea580c" />
            <stop offset="60%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#ffedd5" />
          </linearGradient>
          <linearGradient id="header-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
          <filter id="header-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="16" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#header-bg-grad)" stroke="url(#header-border-grad)" stroke-width="8" />
        <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
          <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 8" />
        </g>
        <circle cx="256" cy="270" r="110" fill="#f97316" opacity="0.08" filter="url(#header-glow)" />
        <!-- Wi-Fi Waves -->
        <path d="M120 180 C 180 110, 332 110, 392 180" fill="none" stroke="url(#header-emerald-grad)" stroke-width="20" stroke-linecap="round" opacity="0.3" />
        <path d="M164 220 C 210 165, 302 165, 348 220" fill="none" stroke="url(#header-emerald-grad)" stroke-width="22" stroke-linecap="round" opacity="0.75" />
        <path d="M208 260 C 232 230, 280 230, 304 260" fill="none" stroke="url(#header-emerald-grad)" stroke-width="24" stroke-linecap="round" />
        <!-- Warp W -->
        <path d="M120 380 L180 240 L230 350 L256 290" fill="none" stroke="url(#header-orange-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M392 380 L332 240 L282 350 L256 290" fill="none" stroke="url(#header-orange-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Core Portal -->
        <polygon points="256,230 286,290 256,350 226,290" fill="url(#header-orange-grad)" opacity="0.9" />
        <polygon points="256,250 271,290 256,330 241,290" fill="#ffffff" />
      </svg>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-xl font-extrabold tracking-tight text-white">WiWarp</h1>
          <span class="text-[9px] bg-slate-900 border border-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-mono">v1.1.0</span>
        </div>
        <p id="active-wifi-net-label" class="text-[10px] text-slate-400 font-medium">No Active Connection</p>
      </div>
    </div>
    
    <!-- System Badge Status -->
    <div class="flex items-center space-x-3">
      <span class="text-[10px] font-bold px-3 py-1 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-300 flex items-center gap-2 shadow-inner">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Tauri Security Engine
      </span>
    </div>
  </div>
</header>
