<!doctype html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiWarp - Wi-Fi & Cloudflare WARP Manager</title>
    
    <!-- Google Fonts: Outfit & JetBrains Mono (For futuristic, tech-oriented look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body class="bg-slate-950 text-slate-100 flex flex-col justify-between h-screen overflow-hidden antialiased font-sans">
    <!-- Glowing background decoration orbs with minimal colorful opacity for depth -->
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-emerald-500/[0.03] blur-[130px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-orange-500/[0.03] blur-[130px] pointer-events-none z-0"></div>
    <div class="absolute top-[40%] left-[45%] w-[400px] h-[400px] rounded-full bg-blue-500/[0.02] blur-[100px] pointer-events-none z-0"></div>

    <!-- Application Header Container -->
    <div id="header-container" class="relative z-10"></div>

    <!-- Main Content Area Container -->
    <main class="relative z-10 w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow overflow-hidden select-none">
      <!-- COLUMN 1: SPEEDOMETER & WI-FI INTEGRATED CARD (Col-span 8) -->
      <div id="speed-wifi-container" class="lg:col-span-8 flex flex-col justify-between h-full overflow-hidden"></div>
      
      <!-- COLUMN 2: CLOUDFLARE WARP CONTROL (Col-span 4) -->
      <div id="warp-control-container" class="lg:col-span-4 flex flex-col justify-between h-full overflow-hidden"></div>
    </main>

    <!-- Modals & Toasts Container -->
    <div id="modals-container"></div>

    <!-- Footer Container -->
    <div id="footer-container" class="relative z-10"></div>
  </body>
</html>
