<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients, filters, and shadows -->
  <defs>
    <!-- Background Gradient for the shield/squircle container -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Emblem Gradient (Orange/Warp) -->
    <linearGradient id="orange-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <!-- Core Emblem Gradient (Cyan/Emerald/Wifi-Diagnostics) -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow/Neon filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Outer Shell (Premium App Icon boundary) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Inner Cyber Grid lines (Futuristic touch) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1.5">
    <line x1="246" y1="24" x2="246" y2="488" />
    <line x1="266" y1="24" x2="266" y2="488" />
    <line x1="24" y1="246" x2="488" y2="246" />
    <line x1="24" y1="266" x2="488" y2="266" />
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="100" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- Glowing background behind the emblem -->
  <circle cx="256" cy="270" r="110" fill="#f97316" opacity="0.08" filter="url(#glow)" />
  <circle cx="256" cy="180" r="90" fill="#10b981" opacity="0.05" filter="url(#glow)" />

  <!-- Main Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Wi-Fi Signal Waves (Futuristic curved segments with rounded caps) -->
    <!-- Wi-Fi Wave 3 (Outer) -->
    <path d="M120 180 C 180 110, 332 110, 392 180" fill="none" stroke="url(#emerald-grad)" stroke-width="20" stroke-linecap="round" opacity="0.3" />
    
    <!-- Wi-Fi Wave 2 (Middle) -->
    <path d="M164 220 C 210 165, 302 165, 348 220" fill="none" stroke="url(#emerald-grad)" stroke-width="22" stroke-linecap="round" opacity="0.75" />

    <!-- Wi-Fi Wave 1 (Inner/Core) -->
    <path d="M208 260 C 232 230, 280 230, 304 260" fill="none" stroke="url(#emerald-grad)" stroke-width="24" stroke-linecap="round" />

    <!-- Space-time / WARP Tunnel / Cyber Shield (Orange Gradient) -->
    <!-- Creating a stylized 'W' + Shield + Lightning Speed lines -->
    <!-- Left Wing of W / Warp Wave -->
    <path d="M120 380 L180 240 L230 350 L256 290" fill="none" stroke="url(#orange-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Wing of W / Warp Wave -->
    <path d="M392 380 L332 240 L282 350 L256 290" fill="none" stroke="url(#orange-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Fast Central Warp Portal Core (A glowing lightning diamond / shield point) -->
    <polygon points="256,230 286,290 256,350 226,290" fill="url(#orange-grad)" filter="url(#glow)" opacity="0.9" />
    <polygon points="256,250 271,290 256,330 241,290" fill="#ffffff" />
  </g>

  <!-- Micro-details / Tech Accents -->
  <!-- Top corner glowing dots -->
  <circle cx="80" cy="80" r="6" fill="#10b981" opacity="0.8" />
  <circle cx="432" cy="80" r="6" fill="#f97316" opacity="0.8" />
  <!-- Bottom connection node -->
  <circle cx="256" cy="430" r="8" fill="#10b981" />
  <path d="M256 390 L256 422" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="2 4" />
</svg>
