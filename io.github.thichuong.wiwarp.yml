app-id: io.github.thichuong.wiwarp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wiwarp
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/wiwarp/cargo
modules:
  - name: wiwarp
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/wiwarp /app/bin/wiwarp
      - install -Dm644 assets/logo.svg /app/share/icons/hicolor/scalable/apps/io.github.thichuong.wiwarp.svg
      - install -Dm644 assets/io.github.thichuong.wiwarp.desktop /app/share/applications/io.github.thichuong.wiwarp.desktop
      - install -Dm644 assets/io.github.thichuong.wiwarp.metainfo.xml /app/share/metainfo/io.github.thichuong.wiwarp.metainfo.xml
    sources:
      - type: dir
        path: .
