[package]
name = "wiwarp"
version = "0.2.0"
description = "A Slint-based GUI Manager for Wi-Fi and Cloudflare WARP on Linux"
edition = "2024"

[dependencies]
slint = "1.16.1"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
glob = "0.3.3"
chrono = { version = "0.4.44", features = ["clock"] }
thiserror = "2.0.11"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }

[build-dependencies]
slint-build = "1.16.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
