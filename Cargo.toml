[package]
name = "netwarp-manager"
version = "0.1.0"
description = "A Slint-based GUI Manager for Wi-Fi and Cloudflare WARP on Linux"
edition = "2021"

[dependencies]
slint = "1.9.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["clock"] }

[build-dependencies]
slint-build = "1.9.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
